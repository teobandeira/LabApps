<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SurvivalNotes Offline</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Montserrat, "Segoe UI", Arial, sans-serif;
        background: #0e1014;
        color: #f4f4f5;
      }
      main {
        width: min(560px, calc(100% - 32px));
        border: 1px solid rgba(248, 113, 113, 0.45);
        border-radius: 20px;
        padding: 24px;
        background: linear-gradient(160deg, #131722, #0f1219);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
      }
      p {
        margin: 0;
        line-height: 1.55;
      }
      strong {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SurvivalNotes</h1>
      <p>Sem conexao agora.</p>
      <p style="margin-top: 10px">
        Abra o app novamente quando tiver internet para sincronizar atualizacoes. O conteudo ja carregado continua
        disponivel <strong>offline</strong>.
      </p>
    </main>
  </body>
</html>
